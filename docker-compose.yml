services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: sqlserver_container
    ports:
      - "1500:1433"  # Cambia 1500 por el puerto que prefieras
    environment:
      SA_PASSWORD: "YourStrongPassword123!"
      ACCEPT_EULA: "Y"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
    driver: local